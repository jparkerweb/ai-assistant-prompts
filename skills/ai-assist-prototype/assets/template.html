<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PROTOTYPE_NAME · prototype</title>
<!--
  ai-assist-prototype · self-contained prototype
  ----------------------------------------------------------------------------
  Open this file directly in a browser (double-click it). No server, no build,
  no dependencies. Use the floating Design Deck to flip between variants, tune
  the look with the dials, leave notes and pins, then click "Export to LLM"
  and paste the copied block back into your AI agent.

  Layout of this file:
    1. MANIFEST  - JSON describing the prototype, its variants, presets and
                   controls. Edit this.
    2. VARIANTS  - one template block (data-variant="...") per design. Edit these.
    3. HARNESS   - the Design Deck and token engine. Do not hand-edit; if it
                   breaks, regenerate the file from the skill's
                   assets/template.html and paste sections 1 and 2 back in.
  ----------------------------------------------------------------------------
-->
</head>
<body>

<!-- ======================= 1. MANIFEST (edit) ======================= -->
<script type="application/json" id="pt-manifest">
{
  "schema": "ai-assist-prototype/manifest@1",
  "id": "example-prototype",
  "name": "Example prototype",
  "kind": "web",
  "brief": "Replace this with the design question this prototype answers, who it is for, and what 'good' looks like.",
  "controls": "web",
  "dials": "standard",
  "defaults": {},
  "extraControls": [],
  "hideControls": [],
  "hidePresets": [],
  "presets": {},
  "variants": [
    {
      "id": "a",
      "name": "Starter",
      "thesis": "A tiny example variant that shows every token in use. Replace it.",
      "tokens": {}
    }
  ]
}
</script>

<!-- ======================= 2. VARIANTS (edit) =======================
  One template block per variant (data-variant="ID"). Inside: a <style>, markup, and
  an optional <script>. Each variant renders in its own isolated document, so
  plain selectors (h1, .hero) never leak between variants. Consume the harness
  tokens (var(--pt-...)) instead of hardcoding colors, fonts, radii and spacing,
  otherwise the Deck's dials will not move your design.
-->
<template data-variant="a">
<style>
  .hero { max-width: var(--pt-container); margin: 0 auto; padding: var(--pt-s-8) var(--pt-s-5) var(--pt-s-6); }
  .eyebrow { color: var(--pt-accent); font-weight: var(--pt-weight-display); letter-spacing: .08em; text-transform: uppercase; font-size: var(--pt-t-xs); }
  .hero h1 { font-size: var(--pt-t-4xl); margin: var(--pt-s-2) 0 var(--pt-s-3); max-width: 18ch; }
  .hero p  { color: var(--pt-text-muted); font-size: var(--pt-t-lg); max-width: 52ch; }
  .actions { display: flex; gap: var(--pt-s-3); margin-top: var(--pt-s-5); flex-wrap: wrap; }
  .grid { max-width: var(--pt-container); margin: 0 auto; padding: 0 var(--pt-s-5) var(--pt-s-8); display: grid; gap: var(--pt-s-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card h3 { margin: 0 0 var(--pt-s-2); font-size: var(--pt-t-lg); }
  .card p  { margin: 0; color: var(--pt-text-muted); }
  .card .kpi { font-family: var(--pt-font-display); font-size: var(--pt-t-3xl); font-weight: var(--pt-weight-display); color: var(--pt-accent); line-height: 1; margin: var(--pt-s-3) 0 var(--pt-s-2); }
  /* Real media queries work: each variant renders in its own document sized by the Deck's viewport buttons. */
  @media (max-width: 640px) { .hero h1 { font-size: var(--pt-t-2xl); } .hero { padding-top: var(--pt-s-6); } }
</style>

<section class="hero">
  <div class="eyebrow">Starter variant</div>
  <h1>Every dial in the Deck moves something on this page.</h1>
  <p>This placeholder exists so the template opens and works before you replace it. Drag the Deck, try a preset, switch the mode, change the fonts, then press Export to LLM.</p>
  <div class="actions">
    <button class="pt-btn pt-btn-primary">Primary action</button>
    <button class="pt-btn">Secondary</button>
    <button class="pt-btn pt-btn-ghost">Ghost</button>
  </div>
</section>

<section class="grid">
  <article class="pt-card card"><h3>Surface</h3><div class="kpi">24</div><p>Cards use <code>--pt-surface</code>, <code>--pt-border-color</code>, <code>--pt-radius</code> and <code>--pt-shadow-sm</code>.</p></article>
  <article class="pt-card card"><h3>Type</h3><div class="kpi">Aa</div><p>Headings use the display font and weight; body text uses the body font, size, line height and tracking.</p></article>
  <article class="pt-card card"><h3>Space</h3><div class="kpi">4·8</div><p>The spacing steps <code>--pt-s-1</code> … <code>--pt-s-9</code> scale with the Density dial.</p></article>
  <article class="pt-card card"><h3>Accent</h3><div class="kpi"><span class="pt-badge">badge</span></div><p>Accent, hover, soft and secondary colors derive from one hue, saturation and lightness.</p></article>
</section>

<script>
  // Optional per-variant behavior. `PT` is provided by the harness inside this variant's document.
  // PT.go('screenId')  PT.tokens()  PT.vars()  PT.on('tokens'|'screen'|'ready', fn)  PT.root (this variant's document)
  PT.on('tokens', function (t) { /* react to dial changes if you need to */ });
</script>
</template>

  input.addEventListener('keydown', (ev) => { ev.stopPropagation(); if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') cancel(); });
  const commit = () => { const note = input.value.trim(); if (!note) return cancel(); state.pins.push({ id: uid(), v: state.v, screen: currentScreen(), sel, snippet, note }); save(); cancel(); renderPins(); toast('Pin added'); };
  const cancel = () => { if (composer) composer.remove(); composer = null; deck.classList.remove('pt-composing'); renderAnnotateBox(); };
  composer = el('div', { class: 'pt-composer' }, [
    el('div', { class: 'pt-composer-target', text: sel + (snippet ? '  "' + snippet + '"' : '') }), input,
    el('div', { class: 'pt-actions' }, [el('button', { class: 'pt-btn pt-primary pt-small', text: 'Add pin', onclick: commit }), el('button', { class: 'pt-btn pt-small', text: 'Cancel', onclick: cancel })])
  ]);
  ui.annotateBox.innerHTML = ''; ui.annotateBox.append(composer); deck.classList.add('pt-composing'); input.focus();
}
let pinRaf = null;
function scheduleLayoutPins() { if (pinRaf) return; pinRaf = requestAnimationFrame(() => { pinRaf = null; layoutPins(); }); }
function layoutPins() {
  pinsLayer.innerHTML = ''; if (!frame || !frameDoc) return; const fr = frame.getBoundingClientRect(); const sc = currentScreen();
  state.pins.forEach((p, i) => {
    if (p.v !== state.v || (p.screen && sc && p.screen !== sc)) return;
    let node = null; try { node = frameDoc.querySelector(p.sel); } catch (e) { node = null; }
    if (!node) return; const r = node.getBoundingClientRect(); if (!r.width && !r.height) return;
    const x = fr.left + clamp(r.left + r.width / 2, 0, fr.width), y = fr.top + clamp(r.top + 8, 0, fr.height);
    if (r.bottom < 0 || r.top > fr.height) return;
    pinsLayer.append(el('div', { class: 'pt-pin', text: String(i + 1), title: p.note + '\n' + p.sel, style: 'left:' + x + 'px;top:' + y + 'px', onclick: () => toast('#' + (i + 1) + ': ' + p.note, 2600) }));
  });
}

/* --------------------------------------------------------------- export */
function buildHandoff() {
  const v = currentVariant(); const i = manifest.variants.indexOf(v); const t = currentTokens(); const d = variantDefaults(v.id); const vars = derive(t);
  const changes = ALL_CONTROLS.filter((c) => !c.macro && String(t[c.id]) !== String(d[c.id])).map((c) => ({ id: c.id, label: c.label, from: fmtVal(c, d[c.id]), to: fmtVal(c, t[c.id]) }));
  const presetName = state.preset[v.id] || null;
  const file = (() => { try { return decodeURIComponent(location.pathname.split('/').pop() || '') || null; } catch (e) { return null; } })();
  const custom = {}; for (const c of CONTROLS) if (c.custom) custom[c.id] = t[c.id];
  const css = ':root {\n' + Object.keys(vars).map((k) => '  ' + k + ': ' + vars[k] + ';').join('\n') + '\n}';
  return {
    schema: HANDOFF_SCHEMA, deckVersion: DECK_VERSION, exportedAt: new Date().toISOString(),
    instructions: 'The user reviewed this prototype and chose the variant in "decision". Rebuild or implement using that variant\'s structure, the "tokens" (or the resolved "css" variables), and honor "notes" and "pins". "changes" lists what the user moved away from the variant defaults.',
    prototype: { id: manifest.id, name: manifest.name, file, kind: KIND, brief: manifest.brief || null, dials: DIALS, exposedDials: CONTROLS.filter((c) => !c.macro).map((c) => c.id), lockedDials: [...hidden].filter((id) => ctrlById(id)) },
    decision: { variantId: v.id, variantName: v.name || v.id, thesis: v.thesis || null, index: i + 1, of: manifest.variants.length, screen: currentScreen() },
    preset: { name: presetName, modified: presetName ? presetModified() : null },
    mode: KIND === 'tui' ? null : (t.mode || 'light'), viewport: state.viewport, macros: clone(state.macros),
    tokens: clone(t), defaults: d, changes, custom, css,
    notes: state.notes || '',
    pins: state.pins.map((p, n) => ({ n: n + 1, variantId: p.v, screen: p.screen || null, selector: p.sel, text: p.snippet || '', note: p.note })),
    snapshots: state.snaps.map((s) => ({ name: s.name, variantId: s.v, screen: s.screen || null, preset: s.preset || null, viewport: s.viewport, tokens: s.tokens, at: s.at })),
    variants: manifest.variants.map((x) => ({ id: x.id, name: x.name || x.id, thesis: x.thesis || null }))

}
function buildHandoffText() {
  const h = buildHandoff(); const L = [];
  L.push('AI-ASSIST PROTOTYPE HANDOFF v1');
  L.push('Prototype: ' + h.prototype.name + (h.prototype.file ? ' (' + h.prototype.file + ')' : '') + ' · ' + (h.prototype.kind === 'tui' ? 'TUI' : 'web'));
  L.push('Decision: variant ' + h.decision.variantId + ' "' + h.decision.variantName + '" (' + h.decision.index + ' of ' + h.decision.of + ')' + (h.decision.screen ? ' · screen: ' + h.decision.screen : '') + (h.decision.thesis ? '\n  thesis: ' + h.decision.thesis : ''));
  L.push('Look: preset ' + (h.preset.name ? h.preset.name + (h.preset.modified ? ' (modified)' : '') : 'custom') + (h.mode ? ' · mode ' + h.mode : '') + ' · viewport ' + h.viewport);
  L.push(h.changes.length ? 'Changed from variant defaults (' + h.changes.length + '): ' + h.changes.map((c) => c.label + ' ' + c.from + '→' + c.to).join(', ') : (HAS_DIALS ? 'Dials: all at variant defaults' : 'Dials: none exposed (fixed look)'));
  if (Object.keys(h.custom).length) L.push('Custom controls: ' + Object.keys(h.custom).map((k) => k + '=' + h.custom[k]).join(', '));
  if (h.notes) L.push('Notes: ' + h.notes.replace(/\n/g, '\n  '));
  if (h.pins.length) { L.push('Pins (' + h.pins.length + '):'); for (const p of h.pins) L.push('  ' + p.n + '. [' + p.variantId + (p.screen ? '/' + p.screen : '') + '] ' + p.selector + (p.text ? ' "' + p.text + '"' : '') + ': ' + p.note); }
  if (h.snapshots.length) L.push('Snapshots (' + h.snapshots.length + '): ' + h.snapshots.map((s) => s.name + ' [' + s.variantId + (s.preset ? ' · ' + s.preset : '') + ']').join(', '));
  L.push(''); L.push('```json'); L.push(JSON.stringify(h, null, 2)); L.push('```');
  return L.join('\n');
}
async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* fall through */ }
  try { const ta = el('textarea', { style: 'position:fixed;left:-9999px;top:0' }); ta.value = text; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); if (ok) return true; } catch (e) { /* fall through */ }
  return false;
}
async function exportHandoff(fmt) {
  const text = fmt === 'json' ? JSON.stringify(buildHandoff(), null, 2) : buildHandoffText();
  const ok = await copyText(text);
  if (ok) { toast(fmt === 'json' ? 'Handoff JSON copied' : 'Handoff copied · paste it into your AI agent', 2600); setStatus('Copied ✓ ' + new Date().toLocaleTimeString(), 'ok'); }
  else { setStatus('Clipboard blocked · copy from the window', 'err'); showModal(text); }
}

/* ------------------------------------------------------------ keyboard */
function onKey(e) {
  const t = e.target; const tag = t && t.tagName; const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable);
  if (e.key === 'Escape') { if (composer) { composer.remove(); composer = null; deck.classList.remove('pt-composing'); renderAnnotateBox(); return; } if (state.annotate) { toggleAnnotate(false); return; } const m = $('.pt-modal'); if (m) m.remove(); return; }
  if (typing) return;
  if (e.key === 'ArrowLeft') { stepVariant(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { stepVariant(1); e.preventDefault(); }
  else if (e.key === '`') { setCollapsed(!state.deck.collapsed); e.preventDefault(); }
  else if (e.key === '[' || e.key === ']') { const sc = screensOf(currentVariant()); if (sc.length > 1) { const i = sc.findIndex((s) => s.id === currentScreen()); setScreen(sc[(i + (e.key === ']' ? 1 : -1) + sc.length) % sc.length].id); e.preventDefault(); } }
  else if (e.shiftKey && (e.key === 'E' || e.key === 'e')) { exportHandoff('text'); e.preventDefault(); }
  else if (e.shiftKey && (e.key === 'S' || e.key === 's')) { addSnapshot(); e.preventDefault(); }
  else if (e.shiftKey && (e.key === 'A' || e.key === 'a')) { toggleAnnotate(); e.preventDefault(); }
}
document.addEventListener('keydown', onKey);

/* ---------------------------------------------------------------- init */
const missing = manifest.variants.filter((v) => !document.querySelector('template[data-variant="' + CSS.escape(v.id) + '"]')).map((v) => v.id);
buildDeck(); mount(); placeDeck();
if (missing.length) setStatus('⚠ missing template for: ' + missing.join(', '), 'err');
else { const nd = CONTROLS.filter((c) => !c.macro && c.id !== 'mode').length; setStatus(manifest.variants.length + ' variant' + (manifest.variants.length === 1 ? '' : 's') + ' · ' + (nd ? nd + ' dial' + (nd === 1 ? '' : 's') : 'no dials'), ''); }
window.__PT__ = { version: DECK_VERSION, manifest, get state() { return state; }, handoff: buildHandoff, handoffText: buildHandoffText, setToken, setMacro, applyPreset, go: setScreen, variant(id) { if (manifest.variants.some((v) => v.id === id)) { state.v = id; save(); mount(); renderAll(); refreshRows(); } return mountReady; }, ready: () => mountReady, frame: () => frame, controls: CONTROLS, allControls: ALL_CONTROLS, dials: DIALS, locked: [...hidden], presets: PRESETS };
console.info('%cai-assist-prototype%c deck v' + DECK_VERSION + ' · ' + manifest.variants.length + ' variant(s) · window.__PT__ for scripting', 'font-weight:bold', '');
})();
